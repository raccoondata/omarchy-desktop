# Hot corners: push the pointer into a screen corner to run an action.
# Change these from Super+Space > Setup > Hot Corners, or edit here (no reload
# needed). Actions:
#   none      nothing
#   desktop   show the desktop: minimize this workspace's windows, or bring
#             them back if they're already minimized
#   minimize  minimize this workspace's windows (Super+Shift+Down)
#   restore   bring back all minimized windows (Super+Shift+Up)
#   switcher  window switcher with live previews (Super+Tab); click to pick
#   menu      the Omarchy menu (Super+Space)
#   lock      lock the screen
top-left=none
top-right=restore
bottom-left=none
bottom-right=minimize
# The accent ripple out of the corner when one fires: on | off
effect=on
