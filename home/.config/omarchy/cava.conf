# The audio spectrum for the desktop's equalizers and visualizers (the
# taskbar runs `cava -p` on this while something plays and a visualizer is
# showing). 16 bands, 10 frames a second, as text on stdout.
[general]
bars = 16
framerate = 10
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 55
